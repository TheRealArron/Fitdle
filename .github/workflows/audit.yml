# Dependency advisories land after you ship.
#
# `verify` runs `npm audit` on every push, which only helps if somebody pushes.
# Twice now (2026-09-21 and 2026-11-14) a critical Next.js advisory was
# published against a lockfile that had not changed, and nothing noticed until
# a manual audit. This runs the same check on a schedule, so a new advisory
# fails a run - and GitHub emails the repo owner - within a day of publication.
name: audit

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads package-lock.json against the advisory database; no install
      # needed. Same threshold as `npm run check:audit`: high and critical fail.
      - run: npm audit --audit-level=high
